as m ON m.id = ag.materia_id</text><text x="1275.051" y="584.329" fill="#000" font-size="13" textLength="237.874">WHERE m.programa_id = :programa_id</text><text x="1275.051" y="602.035" fill="#000" font-size="13" textLength="329.238">AND g.curso_academico_id = (curso académico activo)</text><polygon points="1279.051,635.55,1269.051,639.55,1279.051,643.55,1275.051,639.55" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1273.051" y1="639.55" x2="1707.407" y2="639.55" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1285.051" y="633.741" fill="#000" font-size="13" textLength="309.634">filas Guia (con AsignaturaPrograma y Profesorado)</text><polygon points="889.045,667.256,879.045,671.256,889.045,675.256,885.045,671.256" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="883.045" y1="671.256" x2="1257.051" y2="671.256" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="895.045" y="665.447" fill="#000" font-size="13" textLength="57.785">List[Guia]</text><polygon points="499.339,698.962,489.339,702.962,499.339,706.962,495.339,702.962" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="493.339" y1="702.962" x2="867.045" y2="702.962" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="505.339" y="697.153" fill="#000" font-size="13" textLength="263.25">200 OK (List[GuiaResumenResponse] JSON)</text><polygon points="83.724,730.668,73.724,734.668,83.724,738.668,79.724,734.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.724" y1="734.668" x2="477.339" y2="734.668" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="89.724" y="728.859" fill="#000" font-size="13" textLength="381.615">muestra datos del Programa y el listado de Guia con su estado</text><?plantuml-src bLJD