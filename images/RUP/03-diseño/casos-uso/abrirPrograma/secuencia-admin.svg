D"/><text x="1129.055" y="224.445" fill="#000" font-size="13" textLength="259.948">Depends(require_admin) -- endpoint plano</text><text x="1129.055" y="242.151" fill="#000" font-size="13" textLength="388.739">ProgramaResponse (sin tabla agregada), existente desde el lote</text><text x="1129.055" y="259.857" fill="#000" font-size="13" textLength="280.241">de Programa; la Vista pide la tabla en paralelo</text><polygon points="1274.199,293.372,1284.199,297.372,1274.199,301.372,1278.199,297.372" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1118.055" y1="297.372" x2="1280.199" y2="297.372" style="stroke:#181818;stroke-width:1;"/><text x="1125.055" y="291.563" fill="#000" font-size="13" textLength="134.875">obtener(programa_id)</text><polygon points="1773.707,325.078,1783.707,329.078,1773.707,333.078,1777.707,329.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1296.199" y1="329.078" x2="1779.707" y2="329.078" style="stroke:#181818;stroke-width:1;"/><text x="1303.199" y="323.269" fill="#000" font-size="13" textLength="327.288">SELECT ... FROM programas WHERE id = :programa_id</text><polygon points="1307.199,356.784,1297.199,360.784,1307.199,364.784,1303.199,360.784" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1301.199" y1="360.784" x2="1784.707" y2="360.784" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1313.199" y="354.975" fill="#000" font-size="13" textLength="83.057">fila Programa</text><polygon points="1129.055,388.49,1119.055,392.49,1129.055,396.49,1125.055,392.49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1123.055" y1="392.49" x2="1285.199" y2="392.49" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1135.055" y="386.681" fill="#000" font-size="13" textLength="144.144"