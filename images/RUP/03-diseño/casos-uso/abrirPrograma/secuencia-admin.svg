D"/><text x="1222.837" y="224.445" fill="#000" font-size="13" textLength="259.948">Depends(require_admin) -- endpoint plano</text><text x="1222.837" y="242.151" fill="#000" font-size="13" textLength="388.739">ProgramaResponse (sin tabla agregada), existente desde el lote</text><text x="1222.837" y="259.857" fill="#000" font-size="13" textLength="280.241">de Programa; la Vista pide la tabla en paralelo</text><polygon points="1367.981,293.372,1377.981,297.372,1367.981,301.372,1371.981,297.372" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1211.837" y1="297.372" x2="1373.981" y2="297.372" style="stroke:#181818;stroke-width:1;"/><text x="1218.837" y="291.563" fill="#000" font-size="13" textLength="134.875">obtener(programa_id)</text><polygon points="1867.489,325.078,1877.489,329.078,1867.489,333.078,1871.489,329.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1389.981" y1="329.078" x2="1873.489" y2="329.078" style="stroke:#181818;stroke-width:1;"/><text x="1396.981" y="323.269" fill="#000" font-size="13" textLength="327.288">SELECT ... FROM programas WHERE id = :programa_id</text><polygon points="1400.981,356.784,1390.981,360.784,1400.981,364.784,1396.981,360.784" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1394.981" y1="360.784" x2="1878.489" y2="360.784" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1406.981" y="354.975" fill="#000" font-size="13" textLength="83.057">fila Programa</text><polygon points="1222.837,388.49,1212.837,392.49,1222.837,396.49,1218.837,392.49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1216.837" y1="392.49" x2="1378.981" y2="392.49" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1228.837" y="386.681" fill="#000" font-size="13" textLength="144.144">Programa (404 si None)</text><polygon points="601.561,420.196,591.561,424.196,601.561,428.196,597.561,424.196" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="595.561" y1="424.196" x2="1200.837" y2="424.196" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="607.561" y="418.387" fill="#000" font-size="13" textLength="587.276">200 OK (ProgramaResponse JSON, con codigo_ruct, denominacion_oficial (#772) y norma (#794))</text><polygon points="1189.837,451.902,1199.837,455.902,1189.837,459.902,1193.837,455.902" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="590.561" y1="455.902" x2="1195.837" y2="455.902" style="stroke:#181818;stroke-width:1;"/><text x="597.561" y="450.093" fill="#000" font-size="13" textLength="421.057">GET /api/v1/admin/programas/{programa_id}/asignaturas-programa</text><path d="M1216.837,468.902 L1216.837,566.902 L1633.837,566.902 L1633.837,478.902 L1623.837,468.902 L1216.837,468.902" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1623.837,468.902 L1623.837,478.902 L1633.837,478.902 L1623.837,468.902" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1222.837" y="487.799" fill="#000" font-size="13" textLength="260.52">Depends(require_admin) -- filas planas con</text><text x="1222.837" y="505.505" fill="#000" font-size="13" textLength="309.127">materia_nombre y estado, sin agrupar por Materia</text><text x="1222.837" y="523.211" fill="#000" font-size="13" textLength="326.183">(la agrupación sería de presentación, no de consulta);</text><text x="1222.837" y="540.917" fill="#000" font-size="13" textLength="331.201">sin profesorado ni estado de Guia por fila, a diferencia</text><text x="1222.837" y="558.623" fill="#000" font-size="13" textLength="396.097">de GET /api/v1/programas/{programa_id}/asignaturas-programa</text><polygon points="1564.201,592.138,1574.201,596.138,1564.201,600.138,1568.201,596.138" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1211.837" y1="596.138" x2="1570.201" y2="596.138" style="stroke:#181818;stroke-width:1;"/><text x="1218.837" y="590.329" fill="#000" font-size="13" textLength="208.104">listar_del_programa(programa_id)</text><polygon points="1867.489,659.256,1877.489,663.256,1867.489,667.256,1871.489,663.256" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1586.201" y1="663.256" x2="1873.489" y2="663.256" style="stroke:#181818;stroke-width:1;"/><text x="1593.201" y="622.035" fill="#000" font-size="13" textLength="274.287">SELECT ag.* FROM asignaturas_programa ag</text><text x="1593.201" y="639.741" fill="#000" font-size="13" textLength="251.979">JOIN materias m ON m.id = ag.materia_id</text><text x="1593.201" y="657.447" fill="#000" font-size="13" textLength="237.874">WHERE m.programa_id = :programa_id</text><polygon points="1597.201,690.962,1587.201,694.962,1597.201,698.962,1593.201,694.962" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1591.201" y1="694.962" x2="1878.489" y2="694.962" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1603.201" y="689.153" fill="#000" font-size="13" textLength="155.883">filas AsignaturaPrograma</text><polygon points="1222.837,722.668,1212.837,726.668,1222.837,730.668,1218.837,726.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1216.837" y1="726.668" x2="1575.201" y2="726.668" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1228.837" y="720.859" fill="#000" font-size="13" textLength="157.443">List[AsignaturaPrograma]</text><polygon points="601.561,754.374,591.561,758.374,601.561,762.374,597.561,758.374" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:1