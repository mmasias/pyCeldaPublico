48 L1024.687,205.548" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="701.687" y="224.445" fill="#000" font-size="13" textLength="284.96">mismo cliente OAuth (Authlib) que /auth/login,</text><text x="701.687" y="242.151" fill="#000" font-size="13" textLength="318.968">redirect_uri distinto (OAUTH_ADMIN_REDIRECT_URI)</text><text x="701.687" y="259.857" fill="#000" font-size="13" textLength="288.704">para que Google vuelva a /auth/admin/callback</text><polygon points="441.448,293.372,431.448,297.372,441.448,301.372,437.448,297.372" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="435.448" y1="297.372" x2="679.687" y2="297.372" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="447.448" y="291.563" fill="#000" font-size="13" textLength="226.239">302 redirect a Google (OAuth2/OIDC)</text><line x1="81.159" y1="329.078" x2="123.159" y2="329.078" style="stroke:#181818;stroke-width:1;"/><line x1="123.159" y1="329.078" x2="123.159" y2="342.078" style="stroke:#181818;stroke-width:1;"/><line x1="82.159" y1="342.078" x2="123.159" y2="342.078" style="stroke:#181818;stroke-width:1;"/><polygon points="92.159,338.078,82.159,342.078,92.159,346.078,88.159,342.078" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="88.159" y="323.269" fill="#000" font-size="13" textLength="269.074">(en Google) introduce credenciales, autoriza</text><polygon points="668.687,369.784,678.687,373.784,668.687,377.784,672.687,373.784" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="81.159" y1="373.784" x2="674.687" y2="373.784" style="stroke:#181818;stroke-width:1;"/><text x="88.159" y="367.975" fill="#000" font-size="13" textLength="210.366">GET /auth/admin/callback?code=...</text><path d="M695.687,386.784 L695.687,484.784 L1083.687,484.784 L1083.687,396.784 L1073.687,386.784 L695.687,386.784" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1073.687,386.784 L1073.687,396.784 L1083.687,396.784 L1073.687,386.784" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="701.687" y="405.681" fill="#000" font-size="13" textLength="304.798">intercambia el code por el token, obtiene el email.</text><text x="701.687" y="423.387" fill="#000" font-size="13" textLength="363.74">Mismo chequeo de hd que la rama Profesor/DirectorGrado.</text><rect x="710.687" y="434.902" width="3.5" height="3.5" fill="#000"/><text x="717.687" y="441.093" fill="#000" font-size="13" textLength="351.975">No consulta DirectorGradoRepository/ProfesorRepository</text><text x="701.687" y="458.799" fill="#000" font-size="13" textLength="322.725">ni get_current_rol()** -- valida contra ADMIN_EMAILS</text><text x="701.687" y="476.505" fill="#000" font-size="13" textLength="310.57">(whitelist de configuración, no tabla de BD todavía)</text><path d="M65.159,494.314 L127.618,494.314 L127.618,504.02 L117.618,514.02 L65.159,514.02 L65.159,494.314" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="65.159" y="494.314" width="636.528" height="131.806" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="80.159" y="509.211" fill="#000" font-size="13" textLength="17.459" font-weight="700">alt</text><text x="142.618" y="508.073" fill="#000" font-size="11" textLength="177.539" font-weight="700">[email in settings.admin_emails]</text><polygon points="92.159,561.432,82.159,565.432,92.159,569.432,88.159,565.432" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="86.159" y1="565.432" x2="679.687" y2="565.432" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="98.159" y="541.917" fill="#000" font-size="13" textLength="336.635">302 redirect a /panel-administracion + cookie de sesión</text><text x="98.159" y="559.623" fill="#000" font-size="13" textLength="212.641">(JWT con claim rol=admin explícito)</text><line x1="65.159" y1="574.432" x2="701.687" y2="574.432" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="70.159" y="588.191" fill="#000" font-size="11" textLength="266.176" font-weight="700">[email no está en la whitelist -- sin auto-registro]</text><polygon points="92.159,614.12,82.159,618.12,92.159,622.12,88.159,618.12" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="86.159" y1="618.12" x2="679.687" y2="618.12" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="98.159" y="612.311" fill="#000" font-size="13" textLength="241.722">403 Forbidden ("Cuenta no autorizada")</text><?plantuml-src XLJDRjim3BxxAOYSxAv9YdQd0jsGrccNeNz8q-qI861irX6gY9aaPpzlimVeQO-G5nkbE4jI5DZ5e2cH_FZnexpocY1NM5cS8vG43rJKP0g5q8Q1KM9OyJcr-cCWxPLpPGw1JBbWPJmuMg35ahCamSApXTQZgz4glkLhhcgIenQWWyQRo6qlAHSeiQqlodc4c1BI8Kc2B5wE_kZUlz-x7q1wYSwBiRufHbAYnoawWjPv-4e7ENfsyJm_JvAcDBG_x2G-1PnQWYw6dwxcAdJbM4ijWQIQjbtJTi46hfWhJQ5BjKHFko2tPYWYc4xXgZ-IvBMVxLRO1WVSXiMmgffvuATrr5ovEKEX5Havk-j9l50kNwsc6NohgScvnZisbafbgV2JsYee1OMCX26zwpsEFarw-StWTZBivuDX_s8qUHmEih49qug9rkt0iYQzHC0zi0LgFSNYEGc4jr_nTd9q39kw4jVaIIFOu-xT8B_8afBsEjtvtM5jTp2DUGefRPZEP0hUSbaN18KKZ9BKv0v1aB9Llt0tmPkaR_huM719PvrEvxy3a99a2vnFHVsa8SJ1GbGjjkTd4etmrCjqA7XeZaftnkPcFRKP2QySz3Sh8yKQ8UxKlUKdScoxUIIDxLNO60ayEBZbe2rNQn7TtkcG5koK_FtiRiAthh4n2YhoawAsLgGoiQpJxE10PWLBrAh4aDNBfDSQwD_q1jSFOvD-dobFMaOGKCgL9rNL5ekWyKCm3B98Ehu1vxdqM-9ozO9PWjglUnLwP2MygAnodKZn9FfT0h2Hohz9lj99LrQOT3j62O1GLPRgdQ3WPnMtjbasWVdvwoYkNA5HpK6QEujXG3yMUlKY6ohF3MdPzJKg0KxEhtxBgnGutpOfT3W92tffMwf2MNuBwlkZ4xXaErMbg0pIreMyVp8GoRkHMeajAMdAryh-2m00?></g></svg>