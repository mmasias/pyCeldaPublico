ll="#000" font-size="13" textLength="277.132">Depends(require_admin) -- endpoint plano</text><text x="993.267" y="227.059" fill="#000" font-size="13" textLength="395.376">GradoResponse (sin tabla agregada), existente desde el lote</text><text x="993.267" y="242.192" fill="#000" font-size="13" textLength="278.726">de Grado; la Vista pide la tabla en paralelo</text><polygon points="1125.511,272.391,1135.511,276.391,1125.511,280.391,1129.511,276.391" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="982.267" y1="276.391" x2="1131.511" y2="276.391" style="stroke:#181818;stroke-width:1;"/><text x="989.267" y="271.325" fill="#000" font-size="13" textLength="117.159">obtener(grado_id)</text><polygon points="1605.493,301.523,1615.493,305.523,1605.493,309.523,1609.493,305.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1147.511" y1="305.523" x2="1611.493" y2="305.523" style="stroke:#181818;stroke-width:1;"/><text x="1154.511" y="300.458" fill="#000" font-size="13" textLength="304.123">SELECT ... FROM grados WHERE id = :grado_id</text><polygon points="1158.511,330.656,1148.511,334.656,1158.511,338.656,1154.511,334.656" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1152.511" y1="334.656" x2="1616.493" y2="334.656" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1164.511" y="329.59" fill="#000" font-size="13" textLength="63.489">fila Grado</text><polygon points="993.267,359.789,983.267,363.789,993.267,367.789,989.267,363.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="987.267" y1="363.789" x2="1136.511" y2="363.789" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="999.267" y="358.723" fill="#000" font-size="13" textLength="131.244">Grado (404 si None)</text><polygon points="595.195,388.922,585.195,392.922,595.195,396.922,591.195,392.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="589.195" y1="392.922" x2="971.267" y2="392.922" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="601.195" y="387.856" fill="#000" font-size="13" textLength="200.764">200 OK (GradoResponse JSON)</text><polygon points="960.267,418.055,970.267,422.055,960.267,426.055,964.267,422.055" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="584.195" y1="422.055" x2="966.267" y2="422.055" style="stroke:#181818;stroke-width:1;"/><text x="591.195" y="416.989" fill="#000" font-size="13" textLength="369.072">GET /api/v1/admin/grados/{grado_id}/asignaturas-grado</text><path d="M987.267,435.055 L987.267,520.055 L1362.267,520.055 L1362.267,445.055 L1352.267,435.055 L987.267,435.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1352.267,435.055 L1352.267,445.055 L1362.267,445.055 L1352.267,435.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="993.267" y="452.122" fill="#000" font-size="13" textLength="280.287">Depends(require_admin) -- filas planas con</text><text x="993.267" y="467.254" fill="#000" font-size="13" textLength="328.999">materia_nombre y estado, sin agrupar por Materia</text><text x="993.267" y="482.387" fill="#000" font-size="13" textLength="352.168">(la agrupación sería de presentación, no de consulta);</text><text x="993.267" y="497.52" fill="#000" font-size="13" textLength="354.377">sin profesorado ni estado de Guia por fila, a diferencia</text><text x="993.267" y="512.653" fill="#000" font-size="13" textLength="344.341">de GET /api/v1/grados/{grado_id}/asignaturas-grado</text><polygon points="1305.118,542.852,1315.118,546.852,1305.118,550.852,1309.118,546.852" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="982.267" y1="546.852" x2="1