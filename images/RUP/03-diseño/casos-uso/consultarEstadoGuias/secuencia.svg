.921" y1="160.842" x2="691.363" y2="160.842" style="stroke:#181818;stroke-width:1;"/><text x="94.921" y="155.033" fill="#000" font-size="13" textLength="301.86">solicita consultar el estado de las Guías del Grado</text><polygon points="1118.438,188.548,1128.438,192.548,1118.438,196.548,1122.438,192.548" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="707.363" y1="192.548" x2="1124.438" y2="192.548" style="stroke:#181818;stroke-width:1;"/><text x="714.363" y="186.739" fill="#000" font-size="13" textLength="223.327">GET /api/v1/grados/{grado_id}/guias</text><path d="M1145.438,205.548 L1145.438,268.548 L1500.438,268.548 L1500.438,215.548 L1490.438,205.548 L1145.438,205.548" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1490.438,205.548 L1490.438,215.548 L1500.438,215.548 L1490.438,205.548" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1151.438" y="224.445" fill="#000" font-size="13" textLength="185.692">gate: admin_email is not None</text><text x="1151.438" y="242.151" fill="#000" font-size="13" textLength="334.828">or GradoRepository.dirige(grado_id, director_grado_id)</text><text x="1151.438" y="259.857" fill="#000" font-size="13" textLength="202.735">-- 404 uniforme si no (issue #262)</text><polygon points="1305.908,293.372,1315.908,297.372,1305.908,301.372,1309.908,297.372" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1140.438" y1="297.372" x2="1311.908" y2="297.372" style="stroke:#181818;stroke-width:1;"/><text x="1147.438" y="291.563" fill="#000" font-size="13" textLength="158.47">listar_del_grado(grado_id)</text><polygon points="1706.63,395.902,1716.63,399.902,1706.63,403.902,1710.63,399.902" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1327.908" y1="399.902" x2="1712.63" y2="399.902" style="stroke:#181818;stroke-width:1;"/><text x="1334.908" y="323.269" fill="#000" font-size="13" textLength="153.686">SELECT g.* FROM guias g</text><text x="1334.908" y="340.975" fill="#000" font-size="13" textLength="371.722">JOIN asignaturas_grado ag ON ag.id = g.asignatura_grado_id</text><text x="1334.908" y="358.681" fill="#000" font-size="13" textLength="251.979">JOIN materias m ON m.id = ag.materia_id</text><text x="1334.908" y="376.387" fill="#000" font-size="13" textLength="188.24">WHERE m.grado_id = :grado_id</text><text x="1334.908" y="394.093" fill="#000" font-size="13" textLength="329.238">AND g.curso_academico_id = (curso académico activo)</text><polygon points="1338.908,427.608,1328.908,431.608,1338.908,435.608,1334.908,431.608" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1332.908" y1="431.608" x2="1717.63" y2="431.608" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1344.908" y="425.799" fill="#000" font-size="13" textLength="286.416">filas Guia (con AsignaturaGrado y Profesorado)</text><polygon points="1151.438,459.314,1141.438,463.314,1151.438,467.314,1147.438,463.314" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1145.438" y1="463.314" x2="1316.908" y2="463.314" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="1157.438" y="457.505" fill="#000" font-size="13" textLength="57.785">List[Guia]</text><polygon points="718.363,491.02,708.363,495.02,718.363,499.02,714.363,495.02" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="712.363" y1="495.02" x2="1129.438" y2="495.02" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="724.363" y="489.211" fill="#000" font-size="13" textLength="399.074">200 OK (List[GuiaResumenResponse] JSON, con tiene_pdf por fila)</text><path d="M71.921,507.02 L134.38,507.02 L134.38,516.726 L124.38,526.726 L71.921,526.726 L71.921,507.02" style=