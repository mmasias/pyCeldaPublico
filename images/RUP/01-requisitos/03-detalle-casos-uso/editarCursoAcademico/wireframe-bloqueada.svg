<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="150px" preserveAspectRatio="none" style="width:371px;height:150px;" version="1.1" viewBox="0 0 371 150" width="371px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="166" x="6" y="18.8281">EDITAR CURSO ACADÉMICO</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="364" y1="26.8441" y2="26.8441"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="364" y1="28.8441" y2="28.8441"/><text fill="#FF0000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="141" x="6" y="45.1722">⚠ NO SE PUEDE EDITAR</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="364" y1="53.1882" y2="53.1882"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="364" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="165" x="6" y="71.5163">Curso Académico 2026-2027</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="250" x="6" y="89.8604">Este curso académico tiene Guías asociadas.</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="357" x="6" y="108.2045">Los datos de inicio/fin quedan fijos una vez el curso tiene actividad.</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="364" y1="116.2206" y2="116.2206"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="364" y1="118.2206" y2="118.2206"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke: #000000; stroke-width: 2.5;" width="212" x="8.5" y="124.2206"/><text fill