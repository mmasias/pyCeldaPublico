<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="168px" preserveAspectRatio="none" style="width:395px;height:168px;" version="1.1" viewBox="0 0 395 168" width="395px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="174" x="6" y="18.8281">ACTIVAR CURSO ACADÉMICO</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="388" y1="26.8441" y2="26.8441"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="388" y1="28.8441" y2="28.8441"/><text fill="#FF0000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="149" x="6" y="45.1722">⚠ NO SE PUEDE ACTIVAR</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="388" y1="53.1882" y2="53.1882"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="388" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="165" x="6" y="71.5163">Curso Académico 2026-2027</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="381" x="6" y="89.8604">El curso académico 2027-2028 (último) ya tiene actividad registrada.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="363" x="6" y="108.2045">Solo el último curso académico creado, o el penúltimo si el último</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="264" x="6" y="126.5487">no tiene actividad registrada, pueden activarse.</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="388" y1="134.5647" y2="134.5647"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="388" y1="136.5647" y2="136.5647"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke: #000000; stroke-width: 2.5;" width="212" x="8.5" y="142.5647"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="96" x="66.5" y="157.3928">Volver al listado</text></g></svg>