<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:566px;height:222px;background:#FFFFFF;" width="566px" height="222px" viewBox="0 0 566 222" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="7" y="18.139" fill="#000" font-size="12" textLength="165.416" font-weight="700">Activar curso académico</text><rect x="176.916" y="9.5" width="84" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="192.446" y="22.639" fill="#000" font-size="12" textLength="52.939">Cancelar</text><line x1="6" y1="35.469" x2="560.518" y2="35.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="37.469" x2="560.518" y2="37.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="52.107" fill="#000" font-size="12" textLength="71.777" font-weight="700">2027-2028</text><text x="6" y="68.076" fill="#FFA500" font-size="12" textLength="233.596" font-weight="700">Esta acción no se puede deshacer.</text><text x="6" y="84.045" fill="#000" font-size="12" textLength="553.518">Se creará una guía nueva por cada asignatura de programa activa de la institución. Cuando</text><text x="6" y="100.014" fill="#000" font-size="12" textLength="482.063">alguna de esas asignaturas tenga guía en el curso que se desactiva, la nueva la</text><text x="6" y="115.982" fill="#000" font-size="12" textLength="533.607">hereda: clona sus ponderaciones de evaluación, su bibliografía y las sesiones guardadas</text><text x="6" y="131.951" fill="#000" font-size="12" textLength="451.605">de su planificación docente, y toma su contenido y su plantilla del texto de</text><text x="6" y="147.92" fill="#000" font-size="12" textLength="354.34">convocatorias con sus dos campos; si no tiene guía previa,</text><text x="6" y="163.889" fill="#000" font-size="12" textLength="511.518">nace de los datos propios de la asignatura. El semestre y las sesiones mínimas salen</text><text x="6" y="179.857" fill="#000" font-size="12" textLength="525.252">siempre de la asignatura. El curso que estaba activo pasa a inactivo automáticamente.</text><line x1="6" y1="188.188" x2="560.518" y2="188.188" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="195.188" width="180" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="36.033" y="208.326" fill="#000" font-size="12" textLength="124.934">Confirmar activación</text><?plantuml-src RLFDRjGm4BxlKym3xAPG8NvAMRLQzGaueXuczcngoR63nrv0fG_J8uUUU8Iy69-TL4M871B7ckzdlh6lD7FAoZuJc-nEd0ubQRmsR6Lq9kw-kIJ7nAFiJ0n7bqOsBeRD_ORmtDDblxzUS6Gg42nivryLUddMx-adVQ431oCU5RVqq62VyBG5qEUlpj_jy7fVovTD4trC5p5n66IFaXju1Azny-z08P8AJKMia1MzOoEfgzZBiuPRE3uBcIISvaSgWMaeynDJA79YcYAiiWMZkY5mBeb1H5EA0zhaDOQwvPbSqEnoQT8T7Ge76vi0-w4IeqgKzIykfInXU9QKGEBNPBuMgTPXUf7OLe75a-T6UYT9B5-GyH7SMXHcWvNK8XTjQYVsXPkVBIgeTxrtrVcnolq0aq94b_gXSB9eLHixq01CdeCxEhDma8r6GfOje3cELPGmPxJWRCJU2iZE-zgiHtFVSyIgCQBo50tdc1nayTSysuWrZrFKZwIk3Ymx2R8cCYKvETusVC3mMj10MD1edSBaegxflwJQqOr7NwDeJl9lc-Fy5DnOTzXBQCpgP8JI_tbUnW4wxjUHHvfOiSRCrtykY6H-p0Xhh25rZNgtQnySw_K-fFN8B87URXusLn9ilLARpUiEH_jjzw6Np6_-0000?></g></svg>