e="13" textLength="207.886">solicita activar CursoAcademico</text></g><!--link activarCursoAcademico to CURSOS_ACADEMICOS_ABIERTOS_SALIDA--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk14" data-source-line="45" data-link-type="dependency"><path d="M413.9,572.74 C360.63,590.75 326.5,602.3 326.5,602.3 C326.5,602.3 326.5,727.3 326.5,727.3 C326.5,727.3 701.285,755.929 904.155,771.419" style="stroke:#008000;stroke-width:1;" fill="none" id="activarCursoAcademico-to-CURSOS_ACADEMICOS_ABIERTOS_SALIDA"/><polygon points="909.14,771.8,900.471,767.126,904.155,771.419,899.862,775.103,909.14,771.8" fill="#008000" style="stroke:#008000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M331.5,607.3 L331.5,722.3 L985.5,722.3 L985.5,617.3 L975.5,607.3 L331.5,607.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M975.5,607.3 L975.5,617.3 L985.5,617.3 L975.5,607.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="337.5" y="624.367" fill="#000" font-size="13" textLength="600.78">activado; el otro CursoAcademico Activo pasa a Inactivo automáticamente, lista actualizada</text><text x="337.5" y="639.5" fill="#000" font-size="13" textLength="578.291">efecto colateral: nace una Guia por cada AsignaturaPrograma de la institución (con o sin</text><text x="337.5" y="654.633" fill="#000" font-size="13" textLength="573.32">Profesor asignado), clonando PonderacionEvaluacion/ReferenciaBibliografica/contenido/</text><text x="337.5" y="669.765" fill="#000" font-size="13" textLength="633.293">plantilla del texto de convocatorias y las Sesion vinculadas de la planificación docente de la Guia</text><text x="337.5" y="684.898" fill="#000" font-size="13" textLength="607.28">del curso anterior si existe; si no, contenido se siembra de AsignaturaPrograma.contenido, la</text><text x="337.5" y="700.031" fill="#000" font-size="13" textLength="588.548">plantilla es la de su carácter y la planificación docente nace sin sesiones; el semestre sale</text><text x="337.5" y="715.164" fill="#000" font-size="13" textLength="382.529">siempre de AsignaturaPrograma -- ver modelo del dominio</text></g><!--link activarCursoAcademico to CURSOS_ACADEMICOS_ABIERTOS_SALIDA--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk15" data-source-line="56" data-link-type="dependency"><path d="M1030.87,572.5 C1030.65,590.65 1030.5,602.3 1030.5,602.3 C1030.5,602.3 1030.5,727.3 1030.5,727.3 C1030.5,727.3 1031.074,737.548 1031.864,751.838" style="stroke:#F00;stroke-width:1;" fill="none" id="activarCursoAcademico-to-CURSOS_ACADEMICOS_ABIERTOS_SALIDA-1"/><polygon points="1032.14,756.83,1035.637,747.623,1031.864,751.838,1027.649,748.065,1032.14,756.83" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1035.5,652.3 L1035.5,677.3 L1209.5,677.3 L1209.5,662.3 L1199.5,652.3 L1035.5,652.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1199.5,652.3 L1199.5,662.3 L1209.5,662.3 L1199.5,652.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1041.5" y="669.367" fill="#000" font-size="13" textLength="153.867">bloqueado, sin cambios</text></g><!--link activarCursoAcademico to CURSOS_ACADEMICOS_ABIERTOS_SALIDA--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk16" data-source-line="61" data-link-type="dependency"><path d="M1195.44,572.5 C1209.49,590.65 1218.5,602.3 1218.5,602.3 C1218.5,602.3 1218.5,727.3 1218.5,727.3 C1218.5,727.3 1171.09,741.139 1122.14,755.429" style="stroke:#00F;stroke-width:1;" fill="none" id="activarCursoAcademico-to-CURSOS_ACADEMICOS_ABIERTOS_SALIDA-2"/><polygon points="1117.34,756.83,1127.1,758.148,1122.14,755.429,1124.858,750.468,1117.34,756.83" fill="#00F" style="stroke:#00F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1223.5,652.3 L1223.5,677.3 L1395.5,677.3 L1395.5,662.3 L1385.5,652.3 L1223.5,652.3" style="stroke:#181818;stroke-width:0.5;" fill="#FEFF