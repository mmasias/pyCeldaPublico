"13" textLength="542.321">Profesor asignado), clonando PonderacionEvaluacion/ReferenciaBibliografica/contenido/</text><text x="518" y="508.085" fill="#000" font-size="13" textLength="584.181">plantilla del texto de convocatorias y las Sesion vinculadas de la planificación docente de la Guia</text><text x="518" y="525.791" fill="#000" font-size="13" textLength="566.982">del curso anterior si existe; si no, contenido se siembra de AsignaturaPrograma.contenido, la</text><text x="518" y="543.497" fill="#000" font-size="13" textLength="540.852">plantilla es la de su carácter y la planificación docente nace sin sesiones; el semestre sale</text><text x="518" y="561.203" fill="#000" font-size="13" textLength="360.1">siempre de AsignaturaPrograma -- ver modelo del dominio</text></g><!--link activarCursoAcademico to CURSOS_ACADEMICOS_ABIERTOS_SALIDA--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk12" data-source-line="45" data-link-type="dependency"><path d="M1069.94,401.48 C1102.98,418.92 1126,431.07 1126,431.07 C1126,431.07 1126,574.07 1126,574.07 C1126,574.07 1039.475,590.242 959.465,605.192" style="stroke:#F00;stroke-width:1;" fill="none" id="activarCursoAcademico-to-CURSOS_ACADEMICOS_ABIERTOS_SALIDA-1"/><polygon points="954.55,606.11,964.132,608.389,959.465,605.192,962.662,600.525,954.55,606.11" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1131,489.07 L1131,516.07 L1296,516.07 L1296,499.07 L1286,489.07 L1131,489.07" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1286,489.07 L1286,499.07 L1296,499.07 L1286,489.07" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1137" y="507.967" fill="#000" font-size="13" textLength="144.716">bloqueado, sin cambios</text></g><?plantuml-src bLJ1RXit4BtlLmpSGv92jkwE8K1HZDP0qWHMUWg2OCGTgzDmEGh95U8M_PWSSyujL_rO7xcI8pbsq_WWSqdEp7kFRoQzqx3Yo1rv3PAlLq8hyzVbesbIvYmq-_ro_cB-TZgRFZr_VZ4hooSNvvUlNdplVFvsFdrsyNHAdEZetbj7JNFl6Hs__caP