<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="143px" preserveAspectRatio="none" style="width:382px;height:143px;" version="1.1" viewBox="0 0 382 143" width="382px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="143" x="6" y="18.8281">ELIMINAR ASIGNATURA</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="375" y1="26.8441" y2="26.8441"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="375" y1="28.8441" y2="28.8441"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="102" x="6" y="45.1722">Bases de Datos II</text><text fill="#FFA500" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="201" x="6" y="63.5163">Esta acción no se puede deshacer.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="169" x="6" y="81.8604">La asignatura pasará a estado</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="66" x="178" y="81.8604">Extinguido</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="117" x="244" y="81.8604">: no se podrá usar en</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="368" x="6" y="100.2045">nuevas AsignaturaGrado, pero las ya existentes seguirán intactas.</text><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="375" y1="108.2206" y2="108.2206"/><line style="stroke: #AAAAAA; stroke-width: 1.0;" x1="6" x2="375" y1="110.2206" y2="110.2206"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke: #000000; stroke-width: 2.5;" width="172" x="9.5" y="117.2206"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="124" x="33.5" y="132.0487">Confirmar eliminación</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke: #000000; stroke-width: 2.5;" width="68" x="188.5" y="117.2206"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="50" x="197.5" y="132.0487">Cancelar</text></g></svg>