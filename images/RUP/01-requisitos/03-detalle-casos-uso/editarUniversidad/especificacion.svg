link editarUniversidad to UNIVERSIDAD_ABIERTO_SALIDA--><path d="M209.5,496.21 C209.5,516.75 209.5,535.64 209.5,550.35 " fill="none" id="editarUniversidad-&gt;UNIVERSIDAD_ABIERTO_SALIDA" style="stroke: #008000; stroke-width: 1.0;"/><polygon fill="#008000" points="209.5,555.3,213.5,546.3,209.5,550.3,205.5,546.3,209.5,555.3" style="stroke: #008000; stroke-width: 1.0;"/><!--MD5=[bcce2244d822c9940b19b051fb43f645]
@startuml editarUniversidad

skinparam linetype polyline

state UNIVERSIDAD_ABIERTO
state UNIVERSIDAD_ABIERTO_SALIDA as "UNIVERSIDAD_ABIERTO"

UNIVERSIDAD_ABIERTO -[#green]-> editarUniversidad
note on link
<b>Admin</b> solicita editar Universidad
end note

state editarUniversidad as "editarUniversidad()" {

    state " " as EditandoDatos

    [*] -[#green]-> EditandoDatos
    note on link
    <b>Sistema</b> presenta datos actuales de la Universidad
    <b>Sistema</b> permite solicitar guardar
    end note

    EditandoDatos -[#green]-> [*]
    note on link
    <b>Admin</b> introduce nombre
    <b>Admin</b> solicita guardar
    end note
}

editarUniversidad -[#green]-> UNIVERSIDAD_ABIERTO_SALIDA

@enduml

