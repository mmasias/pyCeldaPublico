link editarFacultad to FACULTAD_ABIERTO_SALIDA--><path d="M199,496.21 C199,516.75 199,535.64 199,550.35 " fill="none" id="editarFacultad-&gt;FACULTAD_ABIERTO_SALIDA" style="stroke: #008000; stroke-width: 1.0;"/><polygon fill="#008000" points="199,555.3,203,546.3,199,550.3,195,546.3,199,555.3" style="stroke: #008000; stroke-width: 1.0;"/><!--MD5=[d86a9337fcc6b8543ce275a6988a025d]
@startuml editarFacultad

skinparam linetype polyline

state FACULTAD_ABIERTO
state FACULTAD_ABIERTO_SALIDA as "FACULTAD_ABIERTO"

FACULTAD_ABIERTO -[#green]-> editarFacultad
note on link
<b>Admin</b> solicita editar Facultad
end note

state editarFacultad as "editarFacultad()" {

    state " " as EditandoDatos

    [*] -[#green]-> EditandoDatos
    note on link
    <b>Sistema</b> presenta datos actuales de la Facultad
    <b>Sistema</b> permite solicitar guardar
    end note

    EditandoDatos -[#green]-> [*]
    note on link
    <b>Admin</b> introduce nombre
    <b>Admin</b> solicita guardar
    end note
}

editarFacultad -[#green]-> FACULTAD_ABIERTO_SALIDA

@enduml

