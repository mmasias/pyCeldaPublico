<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="148px" preserveAspectRatio="none" style="width:383px;height:148px;background:#FFFFFF;" version="1.1" viewBox="0 0 383 148" width="383px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="106.2728" x="6" y="18.8281">ELIMINAR GRADO</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="377.5506" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="377.5506" y1="28.8441" y2="28.8441"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="322.9823" x="6" y="45.1722">GIOI -- Grado en Ingenier&#237;a de Organizaci&#243;n Industrial</text><text fill="#FFA500" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="202.8374" x="6" y="63.5163">Esta acci&#243;n no se puede deshacer.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.189" x="6" y="81.8604">El grado pasar&#225; a estado</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="64.3085" x="148.309" y="81.8604">Extinguido</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.733" x="212.6175" y="81.8604">: no admitir&#225; altas nuevas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="370.5506" x="6" y="100.2045">(Materia, AsignaturaGrado...), pero lo ya existente seguir&#225; intacto.</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="377.5506" y1="108.2206" y2="108.2206"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="377.5506" y1="110.2206" y2="110.2206"/><rect fill="#EEEEEE" height="20.