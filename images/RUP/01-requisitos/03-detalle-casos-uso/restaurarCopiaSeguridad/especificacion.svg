ema</text><text x="1475.821" y="255.965" fill="#000" font-size="13" textLength="419.744">presenta solicitud de confirmación con el nombre de la copia elegida</text><text x="1421" y="273.671" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="1475.821" y="273.671" fill="#000" font-size="13" textLength="437.099">advierte que la base de datos actual se sobrescribe y que es irreversible</text><text x="1421" y="291.377" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="1475.821" y="291.377" fill="#000" font-size="13" textLength="409.448">exige escribir el nombre exacto del archivo para permitir confirmar</text></g><!--link SolicitandoConfirmacion to c--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="24" data-link-type="dependency"><path d="M1410,373.358 C1410,400.398 1410,437.948 1410,458.368" style="stroke:#008000;stroke-width:1;" fill="none" id="SolicitandoConfirmacion-to-c"/><polygon points="1410,463.368,1414,454.368,1410,458.368,1406,454.368,1410,463.368" fill="#008000" style="stroke:#008000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1415,396.068 L1415,441.068 L1705,441.068 L1705,406.068 L1695,396.068 L1415,396.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1695,396.068 L1695,406.068 L1705,406.068 L1695,396.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1421" y="414.965" fill="#000" font-size="13" textLength="42.224" font-weight="700">Admin</text><text x="1466.604" y="414.965" fill="#000" font-size="13" textLength="223.925">escribe el nombre exacto del archivo</text><text x="1421" y="432.671" fill="#000" font-size="13" textLength="42.224" font-weight="700">Admin</text><text x="1466.604" y="432.671" fill="#000" font-size="13" textLength="149.292">confirma la restauración</text></g><!--link c to *end*restaurarCopiaSeguridad--><g class="link" data-entity-1="ent0005" data-entit