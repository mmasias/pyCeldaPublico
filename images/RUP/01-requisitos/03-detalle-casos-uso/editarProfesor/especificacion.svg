link editarProfesor to PROFESOR_ABIERTO_SALIDA--><path d="M194,514.45 C194,534.9 194,553.63 194,568.23 " fill="none" id="editarProfesor-&gt;PROFESOR_ABIERTO_SALIDA" style="stroke: #008000; stroke-width: 1.0;"/><polygon fill="#008000" points="194,573.12,198,564.12,194,568.12,190,564.12,194,573.12" style="stroke: #008000; stroke-width: 1.0;"/><!--MD5=[2004ebd4b7aab3adfae2a5e82ad7b43e]
@startuml editarProfesor

skinparam linetype polyline

state PROFESOR_ABIERTO
state PROFESOR_ABIERTO_SALIDA as "PROFESOR_ABIERTO"

PROFESOR_ABIERTO -[#green]-> editarProfesor
note on link
<b>Admin</b> solicita editar Profesor
end note

state editarProfesor as "editarProfesor()" {

    state " " as EditandoDatos

    [*] -[#green]-> EditandoDatos
    note on link
    <b>Sistema</b> presenta datos actuales del Profesor
    <b>Sistema</b> permite solicitar guardar
    end note

    EditandoDatos -[#green]-> [*]
    note on link
    <b>Admin</b> introduce nombre
    <b>Admin</b> introduce email
    <b>Admin</b> solicita guardar
    end note
}

editarProfesor -[#green]-> PROFESOR_ABIERTO_SALIDA

@enduml

