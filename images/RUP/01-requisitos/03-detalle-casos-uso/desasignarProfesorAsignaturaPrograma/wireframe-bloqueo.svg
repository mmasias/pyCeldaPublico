<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:654px;height:101px;background:#FFFFFF;" width="654px" height="101px" viewBox="0 0 654 101" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="164.508" font-weight="700">DESASIGNAR PROFESOR</text><line x1="6" y1="24.469" x2="648.953" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="648.953" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#F00" font-size="12" textLength="641.953">No se puede desasignar: es el único profesor que imparte la asignatura y quedan responsables asignados.</text><text x="6" y="57.076" fill="#F00" font-size="12" textLength="464.555">Marque antes a otro profesor como 'Imparte' o desasigne a los responsables.</text><line x1="6" y1="64.406" x2="648.953" y2="64.406" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="66.406" x2="648.953" y2="66.406" style="stroke:#AAA;stroke-width:1;"/><rect x="9.5" y="73.406" width="52" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="16.349" y="86.545" fill="#000" font-size="12" textLength="38.303">Volver</text><?plantuml-src NP31IiD048Rl-nHpwwcf5X4iCJHWbHviIm9UnCCaEos1pKwStIXI-c9UVJ4tYOJMEUtE_Fj__-pIUHJlq7ZGvD1L1uko4zwJOqdxgsy5G-SWMEFqinBQXnDD2yFlBR4wAWWL5yd3Aa_pzTCcpM2NRHzN-JQBPqNIZ-z33RgI3Sj2I2SR1aVGjAJfZBq0Sa06VhvjLJ8qVr4WiA2gcn2Mm23W60s-kfb62qAkOUkmCC5Y46XsKJphcSb__ZDAPuhMTt9WBsUuack6oNe0Je37XE4167ONi4l4kElnzOND1ydRIPtKagpklbcfwsX-DR-DxWhoUFCB?></g></svg>