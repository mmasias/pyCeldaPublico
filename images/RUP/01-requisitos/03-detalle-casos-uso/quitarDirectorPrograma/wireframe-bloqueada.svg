<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:494px;height:125px;background:#FFFFFF;" width="494px" height="125px" viewBox="0 0 494 125" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="7" y="18.139" fill="#000" font-size="12" textLength="191.602" font-weight="700">Quitar director de programa</text><rect x="203.102" y="9.5" width="164" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="228.084" y="22.639" fill="#000" font-size="12" textLength="52.805">Volver al</text><text x="284.703" y="22.639" fill="#000" font-size="12" textLength="57.416" font-weight="700">profesor</text><line x1="6" y1="35.469" x2="488.471" y2="35.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="37.469" x2="488.471" y2="37.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="52.107" fill="#F00" font-size="12" textLength="129.1" font-weight="700">No se puede quitar</text><text x="6" y="68.076" fill="#000" font-size="12" textLength="62.42" font-weight="700">Profesor:</text><text x="72.234" y="68.076" fill="#000" font-size="12" textLength="140.596">Dr. Carlos Navarro Ruiz</text><text x="6" y="84.045" fill="#000" font-size="12" textLength="70.963" font-weight="700">Programa:</text><text x="80.777" y="84.045" fill="#000" font-size="12" textLength="224.408">GII -- Grado en Ingeniería Informática</text><text x="6" y="100.014" fill="#000" font-size="12" textLength="481.471">Es el único director del programa: un programa no puede quedarse sin director.</text><text x="6" y="115.982" fill="#000" font-size="12" textLength="263.607" font-style="italic">Nombra antes a otro director del programa.</text><?plantuml-src TP51JiCm44NtFiLS80bK28agH9KeghAf2WisYCKadbIMN0yTEqMYz30SW0kmxSLmdIhg1g--FVzz_P5dFg04ZpR0jZTHpurG6rXMmcl13MOVyQ6BYhB6yhOdrAZs2kBPGzbKJua2VS