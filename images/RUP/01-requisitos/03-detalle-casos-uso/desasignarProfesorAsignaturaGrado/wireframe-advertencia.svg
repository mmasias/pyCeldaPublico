<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:827px;height:141px;background:#FFFFFF;" width="827px" height="141px" viewBox="0 0 827 141" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="164.508" font-weight="700">DESASIGNAR PROFESOR</text><line x1="6" y1="24.469" x2="821.447" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="821.447" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#FFA500" font-size="12" textLength="234.527" font-weight="700">⚠ Sin profesorado tras esta acción</text><line x1="6" y1="48.438" x2="821.447" y2="48.438" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="50.438" x2="821.447" y2="50.438" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="65.076" fill="#000" font-size="12" textLength="182.93" font-weight="700">Dr. Manuel Masías Vergara</text><text x="192.744" y="65.076" fill="#000" font-size="12" textLength="100.26">deja de impartir:</text><text x="6" y="81.045" fill="#000" font-size="12" textLength="212.197" font-weight="700">Programación I -- GII, 1er curso</text><text x="6" y="97.014" fill="#000" font-size="12" textLength="814.447" font-style="italic">Esta asignatura-en-grado se quedará sin ningún Profesor asignado. La guía docente que se genere para ella podría quedar incompleta.</text><line x1="6" y1="104.344" x2="821.447" y2="104.344" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="106.344" x2="821.447" y2="106.344" style="stroke:#AAA;stroke-width:1;"/><rect x="9.5" y="113.344" width="188" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="28.872" y="126.482" fill="#000" font-size="12" textLength="149.256">Confirmar desasignación</text><rect x="204.5" y="113.344" width="6