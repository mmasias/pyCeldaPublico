<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="227px" preserveAspectRatio="none" style="width:541px;height:227px;background:#FFFFFF;" version="1.1" viewBox="0 0 541 227" width="541px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="125.2329" x="6" y="18.8281">ELIMINAR PROFESOR</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="535.5677" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="535.5677" y1="28.8441" y2="28.8441"/><text fill="#FF0000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="151.0211" x="6" y="45.1722">&#9888; NO SE PUEDE ELIMINAR</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="535.5677" y1="53.1882" y2="53.1882"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="535.5677" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="160.7052" x="6" y="71.5163">Dr. Manuel Mas&#237;as Vergara</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.0775" x="6" y="89.8604">Este profesor no se puede eliminar:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.0815" x="6" y="108.2045">&#8226; Tiene 3 AsignaturaGrado asignadas</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="309.6143" x="6" y="126.5487">&#8226; Es DirectorGrado del Grado en Ingenier&#237;a Inform&#225;tica</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.1417" x="6" y="144.8928">&#8226; Ha impartido Gu&#237;as en cursos anteriores</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="390.1226" x="6" y="163.2369">Desasigna sus asignaturas y qu&#237;tale el rol de director antes de eliminarlo.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="528.5677" x="6" y="181.581">Las Gu&#237;as impartidas no se pueden desasignar: el bloqueo por ese motivo es permanente.&lt;/i&gt;</text><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="535.5677" y1="189.597" y2="189.597"/><line style="stroke:#AAAAAA;stroke-width:1;" x1="6" x2="535.5677" y1="191.597" y2="191.597"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="156" x="8.5" y="197.597"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="95.9287" x="38.5357" y="212.4251">Volver al listado</text><?plantuml-src NP91Rjim44NtEiLS87AR0baOgf00LXC3IMmuRJP55sDpR12WECuCbQ0e2lGSNRNTznIvIKwI4QKOGRWH2Vq_ypw7fvfGac98GC6tFg8iXRUaB4SFNcWhsDBHEl1TH-Ym-560hMfTDvVpg_drsGgMgyMdvcQngYRhEl_yQ6jGRJYmJ8LSROQdtt_WUW4t3Io_DBC6NWhqlcgIfM_zwtec9LnXx2ZOHn__ey8joGu5SxiiQpGHx4TeY0ngnuuS7H9Di-xfrp_ux2aIV80pzRk8gHCy5tGCcCyEzQ1i56QMVvDO1eapXc574UPnHz6J697jjopjuz_aDtYmNo3uTczNwyrmtcLoysqwKLR0c4Wy2-aGeVBrZ7I00ErqvEdv5Bx3dVaJXZuG20T30JUovL8Ahy86BdFDIxEEZLz8RFlgUgAvnfuoxKiFKsROMraoLSl9trjSXJr9Yv6iLLbD_9inVUq7TSlXdemcGF3sf1ptyu5lnS_YbABhtrTHl2-FtnsVb2VF?></g></svg>