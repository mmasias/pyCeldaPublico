" font-weight="700">Sistema</text><text x="386.821" y="273.965" fill="#000" font-size="13" textLength="372.905">presenta el texto actual de convocatorias en un área de texto</text><text x="332" y="291.671" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="386.821" y="291.671" fill="#000" font-size="13" textLength="770.458">ofrece tres plantillas (asignatura normal, prácticas externas, prácticas de laboratorio) que rellenan el área de texto sin guardar</text><text x="332" y="309.377" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="386.821" y="309.377" fill="#000" font-size="13" textLength="152.087">permite solicitar guardar</text></g><!--link EditandoTexto to c--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="25" data-link-type="dependency"><path d="M321,391.358 C321,418.398 321,455.948 321,476.368" style="stroke:#008000;stroke-width:1;" fill="none" id="EditandoTexto-to-c"/><polygon points="321,481.368,325,472.368,321,476.368,317,472.368,321,481.368" fill="#008000" style="stroke:#008000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M326,414.068 L326,459.068 L808,459.068 L808,424.068 L798,414.068 L326,414.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M798,414.068 L798,424.068 L808,424.068 L798,414.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="332" y="432.965" fill="#000" font-size="13" textLength="55.263" font-weight="700">Profesor</text><text x="390.643" y="432.965" fill="#000" font-size="13">o</text><text x="401.888" y="432.965" fill="#000" font-size="13" textLength="117.546" font-weight="700">DirectorPrograma</text><text x="522.814" y="432.965" fill="#000" font-size="13" textLength="270.205">edita el texto, o elige una plantilla y la ajusta</text><text x="332" y="450.671" fill="#000" font-size="13" textLength="55.263" font-weight="700">Profesor</text><text x="390.643" y="450.671" fill="#000" font-size="13">o</text><text x="401.888" y="450.671" fill="#000" font-size="13" textLength="117.546" font-weight="700">DirectorPrograma</text><text x="522.814" y="450.671" fill="#000" font-size="13" textLength="95.108">solicita guardar</text></g><!--link c to *end*editarTextoSistemaEvaluacion--><g class="link" data-entity-1="ent0005" data-entity-2="ent0010" id="lnk11" data-source-line="31" data-link-type="dependency"><path d="M310.57,496.068 C257.29,501.168 18,524.068 18,524.068 C18,524.068 18,614.068 18,614.068 C18,614.068 250.211,635.528 304.881,640.578" style="stroke:#008000;stroke-width:1;" fill="none" id="c-to-*end*editarTextoSistemaEvaluacion"/><polygon points="309.86,641.038,301.266,636.227,304.881,640.578,300.53,644.193,309.86,641.038" fill="#008000" style="stroke:#008000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M23,529.068 L23,609.068 L599,609.068 L599,539.068 L589,529.068 L23,529.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M589,529.068 L589,539.068 L599,539.068 L589,529.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="29" y="547.965" fill="#000" font-size="13" textLength="371.228">[el texto contiene el marcador [TABLA] exactamente una vez]</text><text x="29" y="565.671" fill="#000" font-size="13" textLength="328.692">[lo edita el DirectorPrograma y la guía está Aprobada]</text><text x="361.072" y="565.671" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="415.893" y="565.671" fill="#000" font-size="13" textLength="168.298">devuelve la guía a Borrador</text><text x="29" y="583.377" fill="#000" font-size="13" textLength="334.698">[lo edita el DirectorPrograma y la guía está EnRevision]</text><text x="367.078" y="583.377" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="421.899" y="583.377" fill="#000" font-size="13" textLength="152.62">pasa la guía a Rechazada</text><text x="29" y="601.083" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="83.821" y="601.083" fill="#000" font-size="13" textLength="306.54">persiste el texto y registra el cambio en el historial</text></g><!--link c to *end*editarTextoSistemaEvaluacion--><g class="link" data-entity-1="ent0005" data-entity-2="ent0010" id="lnk12" data-source-line="39" data-link-type="dependency"><path d="M331.41,496.138 C382.46,501.368 604,524.068 604,524.068 C604,524.068 604,614.068 604,614.068 C604,614.068 389.396,635.306 337.066,640.476" style="stroke:#F00;stroke-width:1;" fill="none" id="c-to-*end*editarTextoSistemaEvaluacion-1"/><polygon points="332.09,640.968,341.44,644.064,337.066,640.476,340.653,636.102,332.09,640.968" fill="#F00" style="stroke:#F00;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M609,546.568 L609,591.568 L1270,591.568 L1270,556.568 L1260,546.568 L609,546.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1260,546.568 L1260,556.568 L1270,556.568 L1260,546.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="615" y="565.465" fill="#000" font-size="13" textLength="338.52">[el marcador [TABLA] aparece cero veces o más de una]</text><text x="615" y="583.171" fill="#000" font-size="13" textLength="51.441" font-weight="700">Sistema</text><text x="669.821" y="583.171" fill="#000" font-size="13" textLength="585.299">presenta mensaje de rechazo: el texto debe contener el marcador [TABLA] exactamente una vez</text></g></g><!--link PONDERACIONES_EVALUACION_ABIERTO to editarTextoSistemaEvaluacion--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk6" data-source-line="7" data-link-type="dependency"><path d="M650.5,57.41 C650.5,82.65 650.5,119.9 650.5,166.77" style="stroke:#008000;stroke-width:1;" fill="none" id="PONDERACIONES_EVALUACION_ABIERTO-to-editarTextoSistemaEvaluacion"/><polygon points="650.5,171.77,654.5,162.77,650.5,166.77,646.5,162.77,650.5,171.77" fill="#0080