<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:904px;height:302px;background:#FFFFFF;" width="904px" height="302px" viewBox="0 0 904 302" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="327.902" font-weight="700">SISTEMA DE EVALUACIÓN -- Programación I (GII)</text><line x1="6" y1="24.469" x2="898.574" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="898.574" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="157.559" font-weight="700">Texto de convocatorias</text><text x="7" y="58.076" fill="#000" font-size="12" textLength="51.633">Plantilla:</text><rect x="290.244" y="46.938" width="151" height="16.969" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="292.244" y="60.076" fill="#000" font-size="12" textLength="111.041">Asignatura normal</text><line x1="430.244" y1="46.938" x2="430.244" y2="63.906" style="stroke:#000;stroke-width:1;"/><polygon points="433.244,52.938,439.244,52.938,436.244,58.906" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="7" y="78.045" fill="#000" font-size="12" textLength="281.244">Instrumento de la convocatoria extraordinaria:</text><text x="293.244" y="78.045" fill="#000" font-size="12" textLength="265.875">la prueba de evaluación final (Examen final)</text><line x1="291.244" y1="80.875" x2="646.244" y2="80.875" style="stroke:#000;stroke-width:1;"/><line x1="291.244" y1="77.875" x2="291.244" y2="79.875" style="stroke:#000;stroke-width:1;"/><line x1="646.244" y1="77.875" x2="646.244" y2="79.875" style="stroke:#000;stroke-width:1;"/><text x="7" y="96.014" fill="#000" font-size="12" textLength="266.273">Porcentaje recuperable en la extraordinaria:</text><text x="294.244" y="97.014" fill="#000" font-size="12" textLength="15.27">50</text><line x1="292.244" y1="99.844" x2="311.244" y2="99.844" style="stroke:#000;stroke-width:1;"/><line x1="292.244" y1="96.844" x2="292.244" y2="98.844" style="stroke:#000;stroke-width:1;"/><line x1="311.244" y1="96.844" x2="311.244" y2="98.844" style="stroke:#000;stroke-width:1;"/><text x="315.244" y="97.014" fill="#000" font-size="12">%</text><text x="7" y="117.982" fill="#000" font-size="12" textLength="85.887" font-weight="700">PROPUESTA:</text><text x="92.887" y="117.982" fill="#000" font-size="12"> </text><text x="96.701" y="117.982" fill="#000" font-size="12" textLength="636.873" font-style="italic">Según los instrumentos de evaluación final de la lista: la prueba de evaluación final (Examen final), 50 %.</text><rect x="738.074" y="109.344" width="156" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="755.348" y="122.482" fill="#000" font-size="12" textLength="121.453">Usar esta propuesta</text><line x1="6" y1="105.844" x2="734.574" y2="105.844" style="stroke:#000;stroke-width:1;"/><line x1="734.574" y1="130.813" x2="897.574" y2="130.813" style="stroke:#000;stroke-width:1;"/><line x1="734.574" y1="105.844" x2="897.574" y2="105.844" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="130.813" x2="734.574" y2="130.813" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="105.844" x2="6" y2="130.813" style="stroke:#000;stroke-width:1;"/><line x1="897.574" y1="105.844" x2="897.574" y2="130.813" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="135.313" x2="898.574" y2="135.313" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="137.313" x2="898.574" y2="137.313" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="152.951" fill="#000" font-size="12" textLength="203.959" font-weight="700">Texto resultante (no editable)</text><text x="7" y="168.92" fill="#000" font-size="12" textLength="169.553">CONVOCATORIA ORDINARIA</text>