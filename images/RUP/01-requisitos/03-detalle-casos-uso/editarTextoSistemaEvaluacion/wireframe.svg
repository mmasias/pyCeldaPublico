<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1125px;height:568px;background:#FFFFFF;" width="1125px" height="568px" viewBox="0 0 1125 568" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="7" y="18.139" fill="#000" font-size="12" textLength="102.738">Vista de Docente</text><line x1="6" y1="6" x2="110.738" y2="6" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="21.969" x2="110.738" y2="21.969" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="6" x2="6" y2="21.969" style="stroke:#000;stroke-width:1;"/><line x1="110.738" y1="6" x2="110.738" y2="21.969" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="26.469" x2="1119.479" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="28.469" x2="1119.479" y2="28.469" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="44.107" fill="#000" font-size="12" textLength="89.285" font-weight="700">Guía docente</text><rect x="100.785" y="35.469" width="52" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="110.909" y="48.607" fill="#000" font-size="12" textLength="31.752">Inicio</text><rect x="159.785" y="35.469" width="108" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="169.362" y="48.607" fill="#000" font-size="12" textLength="88.846">Mis programas</text><rect x="274.785" y="35.469" width="76" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="288.621" y="48.607" fill="#000" font-size="12" textLength="48.328">Mi perfil</text><rect x="357.785" y="35.469" width="108" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="371.836" y="48.607" fill="#000" font-size="12" textLength="79.898">Cerrar sesión</text><text x="7" y="71.076" fill="#000" font-size="12" textLength="127.125">GII · Programación I ›</text><text x="137.939" y="71.076" fill="#000" font-size="12" textLength="72.885" font-weight="700">Evaluación</text><rect x="215.324" y="62.438" width="140" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="230.346" y="75.576" fill="#000" font-size="12" textLength="109.957">Crear instrumento</text><line x1="6" y1="88.406" x2="1119.479" y2="88.406" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="90.406" x2="1119.479" y2="90.406" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="97.406" x2="1119.479" y2="97.406" style="stroke:#AAA;stroke-width:1;stroke-dasharray:1,2;"/><line x1="6" y1="104.406" x2="1119.479" y2="104.406" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="106.406" x2="1119.479" y2="106.406" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="121.045" fill="#000" font-size="12" textLength="157.559" font-weight="700">Texto de convocatorias</text><text x="6" y="137.014" fill="#000" font-size="12" textLength="483.07">Texto del apartado 5 de la guía. No se edita: sale de la plantilla que se elija, con</text><text x="6" y="152.982" fill="#000" font-size="12" textLength="459.703">el instrumento y el porcentaje de la convocatoria extraordinaria. La tabla de</text><text x="6" y="168.951" fill="#000" font-size="12" textLength="172.822">instrumentos va donde pone</text><text x="182.637" y="168.951" fill="#000" font-size="12" textLength="54.521" font-weight="700">[TABLA]</text><text x="237.158" y="168.951" fill="#000" font-size="12">.</text><text x="7" y="185.92" fill="#000" font-size="12" textLength="60.521" font-weight="700">Plantilla:</text><rect x="69.521" y="174.781" width="151" height="16.969" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="71.521" y="187.92" fill="#000" font-size="12" textLength="111.041">Asignatura normal</text><line x1="209.521" y1="174.781" x2="209.521" y2="191.75" style="stroke:#000;stroke-width:1;"/><polygon points="212.521,180.781,218.521,180.781,215.521,186.75" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="7" y="207.889" fill="#000" font-size="12" textLength="318.516" font-weight="700">Instrumento de la convocatoria extraordinaria:</text><text x="330.516" y="207.889" fill="#000" font-size="12" textLength="336.715">la prueba de evaluación final (Examen Teórico-Práctico)</text><line x1="328.516" y1="210.719" x2="771.516" y2="210.719" style="stroke:#000;stroke-width:1;"/><line x1="328.516" y1="207.719" x2="328.516" y2="209.719" style="stroke:#000;stroke-width:1;"/><line x1="771.516" y1="207.719" x2="771.516" y2="209.719" style="stroke:#000;stroke-width:1;"/><text x="7" y="227.857" fill="#000" font-size="12" textLength="301.805" font-weight="700">Porcentaje recuperable en la extraordinaria:</text><text x="313.805" y="227.857" fill="#000" font-size="12" textLength="15.27">35</text><line x1="311.805" y1="230.688" x2="346.805" y2="230.688" style="stroke:#000;stroke-width:1;"/><line x1="311.805" y1="227.688" x2="311.805" y2="229.688" style="stroke:#000;stroke-width:1;"/><line x1="346.805" y1="227.688" x2="346.805" y2="229.688" style="stroke:#000;stroke-width:1;"/><text x="350.805" y="227.857" fill="#000" font-size="12">%</text><text x="7" y="247.826" fill="#000" font-size="12" textLength="85.887" font-weight="700">PROPUESTA:</text><text x="92.887" y="247.826" fill="#000" font-size="12"> </text><text x="96.701" y="247.826" fill="#000" font-size="12" textLength="857.777" font-style="italic">Según los instrumentos de evaluación final de la lista: las pruebas de evaluación final (Examen Teórico-Práctico y Entrega de proyecto), 55 %.</text><rect x="958.979" y="239.188" width="156" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="976.252" y="252.326" fill="#000" font-size="12" textLength="121.453">Usar esta propuesta</text><line x1="6" y1="235.688" x2="955.479" y2="235.688" style="stroke:#000;stroke-width:1;"/><line x1="955.479" y1="260.656" x2="1118.479" y2="260.656" style="stroke:#000;stroke-width:1;"/><line x1="955.479" y1="235.688" x2="1118.479" y2="235.688" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="260.656" x2="955.479" y2="260.656" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="235.688" x2="6" y2="260.656" style="stroke:#000;stroke-width:1;"/><line x1="1118.479" y1="235.688" x2="1118.479" y2="260.656" style="stroke:#000;stroke-width:1;"/><text x="6" y="273.795" fill="#000" font-size="12" textLength="515.514">El porcentaje no coincide con la suma de los instrumentos de evaluación final (55 %).</text><text x="7" y="290.764" fill="#000" font-size="12" textLength="169.553">CONVOCATORIA ORDINARIA</text><text x="7" y="322.701" fill="#000" font-size="12" textLength="610.377">En la convocatoria ordinaria de esta asignatura se aplican los siguientes instrumentos de evaluación:</text><text x="7" y="354.639" fill="#000" font-size="12" textLength="48.029">[TABLA]</text><text x="7" y="386.576" fill="#000" font-size="12" textLength="691.371">La calificación del instrumento de la evaluación final (tanto de la convocatoria ordinaria como de la extraordinaria,</text><text x="7" y="402.545" fill="#000" font-size="12" textLength="686.268">según corresponda) no podrá ser inferior, en ningún caso, a 4,0 puntos (escala 0 a 10) para aprobar la asignatura</text><text x="7" y="418.514" fill="#000" font-size="12" textLength="504.838">y consecuentemente poder realizar el cálculo de porcentajes en la calificación final.</text><text x="7" y="450.451" fill="#000" font-size="12" textLength="209.232">CONVOCATORIA EXTRAORDINARIA</text><text x="7" y="482.389" fill="#000" font-size="12" textLength="688.857">La convocatoria extraordinaria tendrá lugar durante el mes de julio (consúltese el calendario académico fijado por</text><text x="7" y="498.357" fill="#000" font-size="12" textLength="682.225">la universidad). Esta consistirá en la prueba de evaluación final (Examen Teórico-Práctico), con un valor del 35 %</text><text x="7" y="514.326" fill="#000" font-size="12" textLength="625.354">de la nota final de la asignatura. El resto de la nota se complementará con la calificación obtenida en la</text><text x="7" y="530.295" fill="#000" font-size="12" textLength="297.146">evaluación continua de la convocatoria ordinaria.</text><line x1="6" y1="278.625" x2="699.371" y2="278.625" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="534.125" x2="699.371" y2="534.125" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="278.625" x2="6" y2="294.594" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="278.625" x2="699.371" y2="294.594" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="518.156" x2="6" y2="534.125" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="518.156" x2="699.371" y2="534.125" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="454.281" x2="6" y2="470.25" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="454.281" x2="699.371" y2="470.25" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="390.406" x2="6" y2="406.375" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="390.406" x2="699.371" y2="406.375" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="326.531" x2="6" y2="342.5" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="326.531" x2="699.371" y2="342.5" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="502.188" x2="6" y2="518.156" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="502.188" x2="699.371" y2="518.156" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="438.313" x2="6" y2="454.281" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="438.313" x2="699.371" y2="454.281" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="374.438" x2="6" y2="390.406" style="stroke:#000;stroke-width:1;"/><line x1="699.371" y1="374.438" x2="699.371" y2="390.406" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="310.563" x2="6" y2="326.531" styl