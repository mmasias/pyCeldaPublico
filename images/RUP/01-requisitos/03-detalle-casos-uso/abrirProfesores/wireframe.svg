x="415.227" y="174.893" fill="#000" font-size="12" textLength="1103.911" font-style="italic" text-decoration="line-through">el "/" de arriba es una aproximación. Render real de la celda: nombre en línea principal, email debajo con className="nota" (0.875rem, gris). Última fila: Profesor sin nombre (null, fila del seed sin backfillear)</text><text x="1525.378" y="174.893" fill="#000" font-size="12" textLength="318.578" font-style="italic">línea principal cae al email, sin .nota debajo (no se duplica).</text><text x="6" y="193.237" fill="#000" font-size="12" textLength="1696.954" font-style="italic">Columna "Asignaturas" = número de AsignaturaGrado impartidas hoy (issue 310), recuento en vivo vía asignaturas_grado_profesores -- no columna propia, sin migración. Tabla en jerarquía de texto (patrón #283): "Profesor" a tamaño base (con el email en su .nota interno), "Asignaturas" y los botones un punto menos.</text><line x1="6" y1="201.253" x2="1844.957" y2="201.253" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="203.253" x2="1844.957" y2="203.253" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="209.253" width="148" height="20.344" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="34.014" y="224.081" fill="#000" font-size="12" textLength="96.973" font-weight="700">+ Crear Profesor</text><?plantuml-src ZLJDJXH14BxlKrIMosvSUfSb2Y6m0H5DJ1Io62w4a9gPshMnVyRgcPKLEVWQlWC7uythl9ZLit-WH9raqZDLrLzzzLLrxuS2kGXe2i24DP-m7r7mJ67zasOQCLfgt3H0djraS38yVdbqUZmyEjtj9eFQkYTF_N6pLY-Bo3aEV8b_1q6F7HObOn23Ykyo-0KhU8Ek92DBgEuav8nuZ8pG1LixbCMWCUoNZh0mw0gTUaKHQbFUyuD8_29-7HbjjKE-U83-slEOu51goZrKNyq4cJuB-5MqgxIsFuAzyJ_OPpebLn0ynoaoQpZ4QVN32VXavb39pF48VlzV-CPFCrHe7gsyzxVTjxE6wS6XDwLr2Cr5FvhGqY6K19iR_VOEr8rt7Z3N1Y7p0Knr9xa2PCAUlInGolwKJ8QmlWxIfMQt6SsngWH1oCG0pDbVQukfbl8L3CbbnC249iQQESAEvB894v2R9uASjKjrZgO3P577y0IlFAJUGIgbXxSoWNjDvmiKxZsrlVMKoNPWp3gq5LJVJ25fOIJyTs0vTK6xHQgMAus0Z-e2XNuWocf_Wka7iHf2RiVIVYS4AKgLPaQhKszHaSQ2OKjq2mHPcHkTObljTlNW3ztlJNuJzi1LFotDP5rvNZ5c7