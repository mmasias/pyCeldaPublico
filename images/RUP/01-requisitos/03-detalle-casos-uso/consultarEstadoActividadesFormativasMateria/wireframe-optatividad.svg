<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:641px;height:141px;background:#FFFFFF;" width="641px" height="141px" viewBox="0 0 641 141" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="364.477" font-weight="700">ACTIVIDADES FORMATIVAS -- ESTADO DE LA MATERIA</text><line x1="6" y1="24.469" x2="635.852" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="635.852" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="94.178" font-weight="700">Programación</text><text x="103.992" y="41.107" fill="#000" font-size="12" textLength="59.355">(12 ECTS)</text><line x1="6" y1="49.438" x2="635.852" y2="49.438" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="65.076" fill="#000" font-size="12" textLength="138.322" font-weight="700">Horas de la materia:</text><text x="148.137" y="65.076" fill="#000" font-size="12" textLength="413.367">300 de 300 (12 ECTS a 25 h) -- OK. Informativo, no bloquea guardar.</text><text x="6" y="81.045" fill="#000" font-size="12" textLength="166.828" font-weight="700">Materia con optatividad:</text><text x="176.643" y="81.045" fill="#000" font-size="12" textLength="330.27">sus asignaturas suman 18 ECTS para 12 de la materia.</text><text x="6" y="97.014" fill="#000" font-size="12" textLength="628.852">Cada asignatura lleva 25 h por ECTS, así que la suma de sus horas no se compara con las de la materia.</text><line x1="6" y1="105.344" x2="635.852" y2="105.344" style="stroke:#AAA;stroke-width:1.5;"/><rect x="9.5" y="113.344" width="156" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="30.23" y="126.482" fill="#000" font-size="12" textLength="114.539">Volver a la materia</tex