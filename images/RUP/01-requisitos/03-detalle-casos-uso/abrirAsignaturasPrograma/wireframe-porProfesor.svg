t-weight="700">Leyenda de estado:</text><text x="124.525" y="147.549" fill="#000" font-size="12" textLength="455.871">[ Borrador ] neutro   [ En revisión ] ámbar   [ Aprobada ] verde   [ Rechazada ] rojo</text><text x="6" y="165.893" fill="#000" font-size="12" textLength="1463.181" font-style="italic">Estado como badge de color (issue 280): 4 estados de guia.puml, etiqueta legible, color aditivo -- el texto se queda. Salt no pinta fondos, se anota el color. Variante Profesor de abrirAsignaturasPrograma(), la que compone abrirInicio() y la pantalla /mis-asignaturas-programa.</text><text x="6" y="184.237" fill="#000" font-size="12" textLength="1056.211" font-style="italic">Filas ordenadas por cuatrimestre -> curso -> nombre -> programa (planificación del profesor). Columna Curso combinada curso-semestre en números romanos, formatearCursoSemestre() (issue 508)</text><text x="1068.451" y="184.237" fill="#000" font-size="12" textLength="1157.84" font-style="italic" text-decoration="line-through">issue 292 las había retirado, 508 las reintroduce así. Columna Código añadida en el issue de la columna de código de catálogo (2026-09-30): Asignatura.codigo vía AsignaturaPrograma.asignatura_codigo, puede salir "</text><text x="2226.291" y="184.237" fill="#000" font-size="12" textLength="183.169" font-style="italic">" si asignatura_id no está resuelto.</text><?plantuml-src bLNRRjD047tFLupW9P5YDwHSMbIgcYfKbkX5IK52g49ZUsCMsRjcTXqeRH_u03uY7y03uerN_nYpQqSfbuBgbyokPsRFddF6sJCMoHeiB612aY8ZSuMs9ZGdf7F24eCFaiIS8n5KcdXtBeoctaKF-Db9TW_Z6KIp-E0eEdqnZMOG170oFJwOHeSHJ8uWFZgO7CMJQVCbulZPyVIm-NmQxqSx6yckR_647nzSt5srNAE06vzBbxZVVCzahjl52l3_QceoNE4Yf6QPMa5-DM4gCdq9eKUnQfRAvhk2-1yjurVHQBJ9mG5nFGZELhbGKb3p5JcUQogRfPKfTlc1kSS_JvkbSNkNh-6f9bTAS0PAr9OOnEl8gN7ceLnlbmcOwRdzW2J-0DL2sTow1PIu0tES5397gqbwG555Ei4C6T12K2P-nSD4KPrwZpWy6TSPE0SiSgwt9I_YDPpnWzl0-IkQYG8I2scy4cVGBCi4QGt9OxfQMUUvE1SgyqG9B-XZPpJu2ycSVqDl_-Pt3lpcLAHlyLExI_gTRa-LdNSWrQK6Big5Ep_L1H_NbyRK0iPRey5ZkD-1yiJbjSImgijY2CBAzxMm28N8PLA8OLUCcRHoe