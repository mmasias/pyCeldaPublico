link editarMetodologiaDocente to METODOLOGIA_DOCENTE_ABIERTO_SALIDA--><path d="M237,514.45 C237,534.9 237,553.63 237,568.23 " fill="none" id="editarMetodologiaDocente-&gt;METODOLOGIA_DOCENTE_ABIERTO_SALIDA" style="stroke: #008000; stroke-width: 1.0;"/><polygon fill="#008000" points="237,573.12,241,564.12,237,568.12,233,564.12,237,573.12" style="stroke: #008000; stroke-width: 1.0;"/><!--MD5=[3f062262fe7e2fd9551df156424f1739]
@startuml editarMetodologiaDocente

skinparam linetype polyline

state METODOLOGIA_DOCENTE_ABIERTO
state METODOLOGIA_DOCENTE_ABIERTO_SALIDA as "METODOLOGIA_DOCENTE_ABIERTO"

METODOLOGIA_DOCENTE_ABIERTO -[#green]-> editarMetodologiaDocente
note on link
<b>Admin</b> solicita editar MetodologiaDocente
end note

state editarMetodologiaDocente as "editarMetodologiaDocente()" {

    state " " as EditandoDatos

    [*] -[#green]-> EditandoDatos
    note on link
    <b>Sistema</b> presenta datos actuales de la MetodologiaDocente
    <b>Sistema</b> muestra código
    <b>Sistema</b> permite solicitar guardar
    end note

    EditandoDatos -[#green]-> [*]
    note on link
    <b>Admin</b> introduce descripción
    <b>Admin</b> solicita guardar
    end note
}

editarMetodologiaDocente -[#green]-> METODOLOGIA_DOCENTE_ABIERTO_SALIDA

@enduml

