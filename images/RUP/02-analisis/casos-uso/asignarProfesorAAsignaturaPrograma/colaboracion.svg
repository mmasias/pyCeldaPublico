 C1456.61,302.952 1477.28,300.602 1477.28,300.602 C1477.28,300.602 2332.394,266.124 2489.464,259.784" style="stroke:#181818;stroke-width:1;" fill="none" id="AsignaturaProgramaController-to-Guia"/><polygon points="2494.46,259.582,2485.306,255.948,2489.464,259.784,2485.629,263.942,2494.46,259.582" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1895.789" y="140.664" fill="#000" font-size="8" textLength="261.237">enviarARevision() [solo si el Profesor imparte y la Guia esta Aprobada]</text><path d="M1823.28,149.008 L1823.28,265.008 L2229.28,265.008 L2229.28,159.008 L2219.28,149.008 L1823.28,149.008" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2219.28,149.008 L2219.28,159.008 L2229.28,159.008 L2219.28,149.008" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1829.28" y="167.905" fill="#000" font-size="13" textLength="365.274">issue #254: no se toca Guia -- Profesor aqui. Si la Guia activa</text><text x="1829.28" y="185.611" fill="#000" font-size="13" textLength="380.328">estaba Aprobada, pasa a EnRevision (+ fila de HistorialCambio,</text><text x="1829.28" y="203.317" fill="#000" font-size="13" textLength="373.373">autor centinela) para que el director re-apruebe -- al aprobar,</text><text x="1829.28" y="221.023" fill="#000" font-size="13" textLength="334.165">Guia.aprobar() re-deriva Guia -- Profesor de la plantilla.</text><text x="1829.28" y="238.729" fill="#000" font-size="13" textLength="385.255">issue #827: si solo es responsable, la Guia no cambia de estado</text><text x="1829.28" y="256.435" fill="#000" font-size="13" textLength="299.286">y su fila se anade directamente a Guia -- Profesor</text></g><!--link ProfesorRepository to Profesor--><g class="link" data-entity-1="ent0009" data-entity-2="ent0008" id="lnk19" data-source-line="42" data-link-type="association"><path d="M2411.19,329.602 C2486.43,329.602 2601.13,329.602 2659.7,329.602" style="stroke:#181818;stroke-