<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1700px;height:792px;background:#FFFFFF;" width="1700px" height="792px" viewBox="0 0 1700 792" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="N2" id="ent0001" data-source-line="25"><path d="M56.54,660.92 L56.54,777.156 L532.15,777.156 L532.15,670.92 L522.15,660.92 L56.54,660.92" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M522.15,660.92 L522.15,670.92 L532.15,670.92 L522.15,660.92" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="62.54" y="679.817" fill="#000" font-size="13" textLength="67.444">El segundo</text><text x="133.364" y="679.817" fill="#000" font-size="13" textLength="148.382" font-weight="700">Aprobada a EnRevision</text><text x="285.126" y="679.817" fill="#000" font-size="13" textLength="18.681">del</text><text x="307.187" y="679.817" fill="#000" font-size="13" textLength="42.471" font-weight="700">Admin</text><text x="353.038" y="679.817" fill="#000" font-size="13" textLength="151.333">(issue 254) no es un caso</text><text x="62.54" y="697.523" fill="#000" font-size="13" textLength="451.49">de uso propio: es efecto colateral de asignarProfesorAAsignaturaGrado() /</text><text x="62.54" y="715.229" fill="#000" font-size="13" textLength="448.032">desasignarProfesorAsignaturaGrado() cuando cambian la plantilla de una</text><text x="62.54" y="732.935" fill="#000" font-size="13" textLength="454.61">AsignaturaGrado cuya guia activa esta Aprobada. Al re-aprobar el director,</text><text x="62.54" y="750.641" fill="#000" font-size="13" textLength="178.347">Guia.aprobar() re-deriva Guia</text><text x="247.647" y="750.641" fill="#000" font-size="13" textLength="179.036" text-decoration="line-through">Profesor de AsignaturaGrado</text><text x="433.443" y="750.641" fill="#000" font-size="13" textLength="55.848">Profesor.</text><text x="62.54" y="768.347" fill="#000" font-size="13" textLength="371.735">Un banner en la guia lo explica (patron comentario_rechazo).</text></g><g class="entity" data-qualified-name="N1" id="ent0002" data-source-line="34"><path d="M6,527.78 L6,626.31 L582.698,626.31 L582.698,537.78 L572.698,527.78 L6,527.78" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M572.698,527.78 L572.698,537.78 L582.698,537.78 L572.698,527.78" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="12" y="546.677" fill="#000" font-size="13" textLength="77.948">La transicion</text><text x="93.328" y="546.677" fill="#000" font-size="13" textLength="136.539" font-weight="700">Aprobada a Borrador</text><text x="233.247" y="546.677" fill="#000" font-size="13" textLength="18.681">del</text><text x="255.308" y="546.677" fill="#000" font-size="13" textLength="55.237" font-weight="700">Profesor</text><text x="313.925" y="546.677" fill="#000" font-size="13" textLength="94.588">la disparan tres</text><text x="12" y="564.383" fill="#000" font-size="13" textLength="555.698">casos de uso por el mismo mecanismo (Guia.confirmar_guardado): guardarBorradorGuia(),</text><text x="12" y="582.089" fill="#000" font-size="13" textLength="539.916">importarBibliografiaDeGuiaHermana() e importarPlanificacionDocenteDeGuiaHermana()</text><text x="12" y="599.795" fill="#000" font-size="13" textLength="480.883">(issue 184). Los tres persisten cambios de contenido de la guia y la devuelven a</text><text x="12" y="617.501" fill="#000" font-size="13" textLength="179.725">Borrador si estaba Aprobada.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="4"><ellipse cx="294.35" cy="483.04" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="Borrador" id="ent0004" data-source-line="4"><rect x="807.7" y="458.04" width="79.85" hei